{% extends "mobile/base.html" %}

{% block title %}编辑产品建议{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile/product-suggestion-edit.css') }}">
{% endblock %}

{% block content %}
<!-- 页面头部 -->
<div class="mobile-header">
    <a href="javascript:void(0)" class="back-btn" onclick="goBack()">
        <i class="fa fa-arrow-left"></i> 返回
    </a>
    <span class="title">编辑产品建议</span>
    <a href="javascript:void(0)" class="save-btn" onclick="submitForm()">保存</a>
</div>

<div class="edit-container">
    <form id="editForm">
        <input type="hidden" name="id" value="{{ suggestion.id }}">
        
        <!-- 基本信息 -->
        <div class="form-card">
            <div class="form-group">
                <label class="form-label">建议标题<span class="required">*</span></label>
                <input type="text" class="form-input" name="title" value="{{ suggestion.title }}" placeholder="请输入建议标题" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">优先级<span class="required">*</span></label>
                <select class="form-select" name="priority" required>
                    <option value="">请选择优先级</option>
                    <option value="High" {% if suggestion.priority == 'High' %}selected{% endif %}>高</option>
                    <option value="Medium" {% if suggestion.priority == 'Medium' %}selected{% endif %}>中</option>
                    <option value="Low" {% if suggestion.priority == 'Low' %}selected{% endif %}>低</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">状态<span class="required">*</span></label>
                <select class="form-select" name="status" required>
                    <option value="">请选择状态</option>
                    <option value="Open" {% if suggestion.status == 'Open' %}selected{% endif %}>新建</option>
                    <option value="In Review" {% if suggestion.status == 'In Review' %}selected{% endif %}>审核中</option>
                    <option value="Accepted" {% if suggestion.status == 'Accepted' %}selected{% endif %}>已接受</option>
                    <option value="Rejected" {% if suggestion.status == 'Rejected' %}selected{% endif %}>已拒绝</option>
                    <option value="Implemented" {% if suggestion.status == 'Implemented' %}selected{% endif %}>已实现</option>
                </select>
            </div>
        </div>
        
        <!-- 产品信息 -->
        <div class="form-card">
            <div class="form-group">
                <label class="form-label">产品类型<span class="required">*</span></label>
                <select class="form-select" name="product_type_level1" required>
                    <option value="">请选择产品类型</option>
                    <option value="双向网闸" {% if suggestion.product_type_level1 == '双向网闸' %}selected{% endif %}>双向网闸</option>
                    <option value="单向光闸" {% if suggestion.product_type_level1 == '单向光闸' %}selected{% endif %}>单向光闸</option>
                    <option value="国产网闸" {% if suggestion.product_type_level1 == '国产网闸' %}selected{% endif %}>国产网闸</option>
                    <option value="国产光闸" {% if suggestion.product_type_level1 == '国产光闸' %}selected{% endif %}>国产光闸</option>
                    <option value="防火墙" {% if suggestion.product_type_level1 == '防火墙' %}selected{% endif %}>防火墙</option>
                    <option value="数据交换平台" {% if suggestion.product_type_level1 == '数据交换平台' %}selected{% endif %}>数据交换平台</option>
                    <option value="文件交换系统（山东源鲁）" {% if suggestion.product_type_level1 == '文件交换系统（山东源鲁）' %}selected{% endif %}>文件交换系统（山东源鲁）</option>
                    <option value="文档审计" {% if suggestion.product_type_level1 == '文档审计' %}selected{% endif %}>文档审计</option>
                    <option value="端设备" {% if suggestion.product_type_level1 == '端设备' %}selected{% endif %}>端设备</option>
                    <option value="密件流转" {% if suggestion.product_type_level1 == '密件流转' %}selected{% endif %}>密件流转</option>
                    <option value="真物理隔离网闸" {% if suggestion.product_type_level1 == '真物理隔离网闸' %}selected{% endif %}>真物理隔离网闸</option>
                    <option value="其他" {% if suggestion.product_type_level1 == '其他' %}selected{% endif %}>其他安全设备</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">产品二级分类<span class="required">*</span></label>
                <select class="form-select" name="product_type_level2" required>
                    <option value="">请选择产品二级分类</option>
                    <option value="国产" {% if suggestion.product_type_level2 == '国产' %}selected{% endif %}>国产</option>
                    <option value="标准" {% if suggestion.product_type_level2 == '标准' %}selected{% endif %}>标准</option>
                </select>
            </div>
        </div>
        
        <!-- 详细描述 -->
        <div class="form-card">
            <div class="form-group">
                <label class="form-label">详细描述<span class="required">*</span></label>
                <textarea class="form-textarea" name="description" id="description" placeholder="请输入详细描述" required>{{ suggestion.description }}</textarea>
                <input type="hidden" name="image_references_str" id="imageReferencesStr" value="">
                
                <!-- 图片上传区域 -->
                <div class="image-upload-area" onclick="document.getElementById('imageInput').click()">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">点击上传图片</div>
                    <div class="upload-hint">支持粘贴或点击上传</div>
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                
                <!-- 图片列表 -->
                <div class="image-list" id="imageList"></div>
            </div>
        </div>
        
        <button type="button" class="submit-btn" onclick="submitForm()">保存修改</button>
    </form>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
    <div class="nav-item" onclick="goToWorkboard()">
        <span class="nav-icon">📊</span>
        <span>看板</span>
    </div>
    <div class="nav-item" onclick="goToTicketList()">
        <span class="nav-icon">📝</span>
        <span>工单</span>
    </div>
    <div class="nav-item" onclick="goToCustomerTickets()">
        <span class="nav-icon">📋</span>
        <span>客户</span>
    </div>
    <div class="nav-item active" onclick="goToProductSuggestion()">
        <span class="nav-icon">💡</span>
        <span>建议</span>
    </div>
</div>

<!-- 加载提示 -->
<div class="loading-toast" id="loadingToast">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载中...</div>
</div>

<!-- Toast提示 -->
<div class="toast" id="toast"></div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/mobile/product-suggestion-edit.js') }}"></script>
{% endblock %}
