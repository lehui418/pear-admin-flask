{% extends "mobile/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block css %}
<style>
    .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: #f5f5f5;
    }
    
    .error-icon {
        font-size: 64px;
        margin-bottom: 20px;
    }
    
    .error-title {
        font-size: 20px;
        color: #333;
        margin-bottom: 10px;
        font-weight: 500;
    }
    
    .error-message {
        font-size: 14px;
        color: #666;
        text-align: center;
        margin-bottom: 30px;
        line-height: 1.6;
    }
    
    .back-btn {
        padding: 12px 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-icon">⚠️</div>
    <div class="error-title">{{ title }}</div>
    <div class="error-message">{{ message }}</div>
    <a href="{{ url_for('system.ticket.main') }}?mobile=1" class="back-btn">返回列表</a>
</div>
{% endblock %}
