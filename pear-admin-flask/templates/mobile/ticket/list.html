{% extends "mobile/base.html" %}

{% block title %}工单列表{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile/ticket-list.css') }}">
{% endblock %}

{% block content %}
<!-- 页面头部 -->
<div class="mobile-header">
    <button class="home-btn" onclick="goToHome()">
        <i class="fa fa-home"></i> 首页
    </button>
    <span class="title">工单列表</span>
    <a href="{{ url_for('system.ticket.add_view') }}?mobile=1" class="add-btn">
        <i class="fa fa-plus"></i> 新增工单
    </a>
</div>

<!-- 搜索栏 -->
<div class="search-bar">
    <div class="search-input-wrapper">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索标题、客户、序列号、负责人..." onfocus="showSearchHistory()" oninput="toggleClearBtn()">
        <span class="clear-search" id="clearSearch" onclick="clearSearch()">×</span>
    </div>
    <button class="search-btn" onclick="searchTickets()">搜索</button>
</div>

<!-- 搜索历史 -->
<div class="search-history" id="searchHistory">
    <div class="history-header">
        <span class="history-title">搜索历史</span>
        <span class="clear-history" onclick="clearAllHistory()">清空</span>
    </div>
    <div class="history-list" id="historyList">
        <!-- 历史记录动态插入 -->
    </div>
</div>

<!-- 筛选栏 -->
<div class="filter-bar" id="filterBar">
    <div class="filter-item" id="filterStatus" onclick="toggleFilterPanel('status')">
        <span>状态</span>
        <span class="arrow">▼</span>
    </div>
    <div class="filter-item" id="filterPriority" onclick="toggleFilterPanel('priority')">
        <span>优先级</span>
        <span class="arrow">▼</span>
    </div>
    <div class="filter-item" id="filterTime" onclick="toggleFilterPanel('time')">
        <span>时间</span>
        <span class="arrow">▼</span>
    </div>
</div>

<!-- 筛选面板 -->
<div class="filter-panel" id="filterPanel">
    <div class="filter-options" id="filterOptions">
        <!-- 选项动态插入 -->
    </div>
    <div class="filter-actions">
        <button class="filter-btn reset" onclick="resetFilter()">重置</button>
        <button class="filter-btn confirm" onclick="confirmFilter()">确定</button>
    </div>
</div>

<!-- 遮罩层 -->
<div class="filter-mask" id="filterMask" onclick="closeFilterPanel()"></div>

<!-- 工单列表 -->
<div class="mobile-content pull-to-refresh" id="pullToRefresh">
    <!-- 下拉刷新指示器 -->
    <div class="refresh-indicator" id="refreshIndicator">
        <span class="refresh-icon" id="refreshIcon">↓</span>
        <span class="refresh-text" id="refreshText">下拉刷新</span>
    </div>
    
    <div class="ticket-list" id="ticketList">
        <div class="loading-hint">加载中...</div>
    </div>
    <!-- 加载更多 -->
    <div class="load-more" id="loadMore" onclick="loadMoreTickets()">
        <div class="load-more-icon"></div>
        <span class="load-more-text">上拉加载更多</span>
    </div>
</div>

<!-- 回到顶部按钮 -->
<div class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</div>

<!-- 删除确认弹窗 -->
<div class="delete-modal" id="deleteModal">
    <div class="delete-modal-content">
        <div class="delete-modal-icon">🗑️</div>
        <div class="delete-modal-title">确认删除</div>
        <div class="delete-modal-desc">删除后将无法恢复，是否继续？</div>
        <div class="delete-modal-actions">
            <button class="delete-modal-btn cancel" onclick="hideDeleteModal()">取消</button>
            <button class="delete-modal-btn confirm" onclick="confirmDeleteTicket()">删除</button>
        </div>
    </div>
</div>

<!-- 加载提示 -->
<div class="loading-toast" id="loadingToast">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载中...</div>
</div>

<!-- Toast提示 -->
<div class="toast" id="toast"></div>

<!-- 底部导航 -->
<div class="bottom-nav">
    <div class="nav-item" onclick="goToWorkboard()">
        <span class="nav-icon">📊</span>
        <span>看板</span>
    </div>
    <div class="nav-item active" onclick="goToTicketList()">
        <span class="nav-icon">📝</span>
        <span>工单</span>
    </div>
    <div class="nav-item" onclick="goToCustomerTickets()">
        <span class="nav-icon">📋</span>
        <span>客户</span>
    </div>
    <div class="nav-item" onclick="goToProductSuggestion()">
        <span class="nav-icon">💡</span>
        <span>建议</span>
    </div>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='index/layui/layui.js') }}"></script>
<script src="{{ url_for('static', filename='js/mobile/ticket.js') }}"></script>
{% endblock %}
